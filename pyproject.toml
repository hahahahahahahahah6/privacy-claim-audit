[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-claim-audit"
version = "0.1.0"
description = "Offline static audit of privacy prose against Python source"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
privacy-claim-audit = "privacy_claim_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
